# Keeps public/cards.json (jonin.cards) identical to the Supabase card list.
# Runs every 15 minutes and on demand; commits only when something changed.
name: Sync card list from Supabase
on:
  schedule: [{ cron: "*/15 * * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["public/cards.json", "public/card/**", "public/set/**", "public/sitemap.xml", "public/robots.txt", "public/img/**"]
permissions:
  contents: write
concurrency: { group: sync-cards, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow
      - name: Move Card Index scan uploads into Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: cd pipeline && python drain_uploads.py
      - name: Copy card images to the site (served by Cloudflare, not Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: cd pipeline && python mirror_images.py
      - name: Load scan-read card details (pending until approved on /admin/)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: cd pipeline && python load_card_attrs.py
      - name: Export from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python pipeline/export_cards.py
      - name: Count new slab photos to crop and flatten
        id: slabs
        run: echo "n=$(python pipeline/slab_tiles.py --pending)" >> "$GITHUB_OUTPUT"
      - name: Cache the background-removal model
        if: steps.slabs.outputs.n != '0'
        uses: actions/cache@v4
        with: { path: ~/.u2net, key: rembg-isnet-general-use }
      - name: Crop, flatten and blur certs on new slab photos
        if: steps.slabs.outputs.n != '0'
        run: |
          sudo apt-get install -y -qq tesseract-ocr >/dev/null
          pip install -q "rembg[cpu]" opencv-python-headless pytesseract
          python pipeline/slab_tiles.py
      - name: Build card and set pages
        run: python pipeline/build_pages.py
      - name: Commit if changed
        run: |
          OUT="public/cards.json public/card public/set public/sitemap.xml public/robots.txt public/img public/index.html pipeline/lastmod.json public/character public/characters public/news public/privacy public/terms public/articles pipeline/article_sales.json pipeline/card_recent_sales.json pipeline/card_price_history.json public/battle public/missions public/most-valuable public/lists public/most-popular pipeline/votes.json pipeline/slab_tiles.json pipeline/sale_photos_raw"
          if [ -z "$(git status --porcelain $OUT)" ]; then echo "No change"; exit 0; fi
          git config user.name "jonin-bot"
          git config user.email "jonin-bot@users.noreply.github.com"
          git add -A $OUT
          git commit -m "Sync cards.json, card pages and card images from Supabase"
          git push
