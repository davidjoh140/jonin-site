# Keeps public/cards.json (jonin.cards) identical to the Supabase card list.
# Runs every 30 minutes and on demand; commits only when something changed.
name: Sync card list from Supabase
on:
  schedule: [{ cron: "*/30 * * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["public/cards.json"]
permissions:
  contents: write
concurrency: { group: sync-cards, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Export from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python pipeline/export_cards.py
      - name: Commit if changed
        run: |
          if git diff --quiet public/cards.json; then echo "No change"; exit 0; fi
          git config user.name "jonin-bot"
          git config user.email "jonin-bot@users.noreply.github.com"
          git add public/cards.json
          git commit -m "Sync cards.json from Supabase"
          git push
