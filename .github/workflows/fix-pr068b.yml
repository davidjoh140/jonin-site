name: One-off PR068B scan fix
on:
  push: { branches: [fix-pr068b-images] }
permissions: { contents: write }
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pillow boto3 requests
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://f6d20bce1fc2f76725b857ef0fed6d10.r2.cloudflarestorage.com
          R2_BUCKET: jonin-scans
          WRITE_MASTER: "0"
        run: python pipeline/oneoff/fix_pr068b.py
      - run: |
          mkdir /tmp/p && cp out/*_strip.png /tmp/p/ && cd /tmp/p && git init -q -b preview && git add . \
            && git -c user.name=bot -c user.email=bot@jonin.cards commit -qm preview \
            && git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} preview:fix-pr068b-preview
