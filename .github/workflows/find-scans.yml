# Looks for card images on eBay / PSA and queues them in Supabase for review.
# Nothing goes public until David approves it.
name: Find card scans
on:
  schedule: [{ cron: "17 9 * * *" }]   # daily, 4:17am New York (placeholder)
  workflow_dispatch:
    inputs:
      set_filter:
        description: "Set id to scan (e.g. 1), or 'all'. Blank = pipeline/settings.py"
        required: false
concurrency: { group: find-scans, cancel-in-progress: false }
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow pytest
      - run: cd pipeline && python -m pytest -q
        env: { SUPABASE_URL: "test", SUPABASE_SERVICE_KEY: "test" }
      - name: Find scans
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          PSA_TOKEN: ${{ secrets.PSA_TOKEN }}
          SET_FILTER: ${{ github.event.inputs.set_filter }}
        run: cd pipeline && python find_scans.py
