<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B1622">
<title>Naruto music · jonin.cards</title>
<link rel="icon" href="/favicon-32.png">
<link rel="stylesheet" href="/themes.css?v=2">
<script src="/theme.js?v=8"></script>
<style>
:root{--bg:#1B1622;--panel:#241E2D;--line:#352C40;--ink:#FFF4E6;--mute:#B8AEA6;--acc:#F57C00;--deep:#17121D;--edge:#3A3046}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:500 14px Inter,system-ui,sans-serif}
body{display:flex;flex-direction:column;gap:8px;padding:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top b{font-size:14px}
.top a{color:var(--mute);font-size:12px;text-decoration:none}
.top a:hover{color:var(--acc)}
.frame{flex:1;min-height:200px;border-radius:10px;overflow:hidden;border:1px solid var(--edge);background:#000}
.frame iframe{width:100%;height:100%;border:0;display:block}
.tip{color:var(--mute);font-size:12px;margin:0}
</style>
</head>
<body>
<div class="top"><b>🎵 Naruto music</b><a href="https://www.youtube.com/playlist?list=PLF7A13C44809B5893" target="_blank" rel="noopener">Open on YouTube ↗</a></div>
<div class="frame"><iframe src="https://www.youtube.com/embed/videoseries?list=PLF7A13C44809B5893&autoplay=1&rel=0" title="Naruto music playlist" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
<p class="tip">Keep this window open and keep browsing jonin.cards in the other one.</p>
</body>
</html>
