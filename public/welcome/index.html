<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up your account — Jonin</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1B1622">
<link rel="icon" href="/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/pages.css?v=3"><link rel="stylesheet" href="/themes.css?v=2"><script src="/theme.js?v=3"></script>
<style>
/* /welcome/: one-time setup after sign-up (David, 2026-11-26). Favorite characters, a few questions, theme. Skippable.
   Simplified 2026-11-26: all 40 characters in a scroll box with search on top, picks update in place
   (no jump back to the top), shorter copy, theme names only. Skip keeps whatever was already picked. */
main{max-width:720px}
.wz{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px 24px 20px;margin-top:10px}
.top{display:flex;align-items:center;gap:12px;margin:0 0 16px}.steps{display:flex;gap:6px;flex:1}.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--acc)}
.top small{color:var(--mute);font-size:12px;white-space:nowrap}
.wz h1{font-size:28px;margin:0 0 4px}.wz .mt{margin:0 0 16px;color:var(--mute)}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ch{all:unset;box-sizing:border-box;cursor:pointer;display:grid;justify-items:center;gap:6px;padding:10px 6px;border:1px solid var(--line);border-radius:12px;font-size:13px;text-align:center;position:relative}
.ch img{width:52px;height:52px;border-radius:50%;object-fit:cover}.ch:hover{border-color:var(--acc)}
.ch[aria-pressed=true]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent)}
.ch .n{position:absolute;top:6px;right:6px;background:var(--acc);color:var(--bg);font:700 11px/18px Inter,sans-serif;min-width:18px;height:18px;border-radius:9px;text-align:center;padding:0 4px}
.more{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.cbox{max-height:min(56vh,470px);overflow-y:auto;padding:8px 4px 8px 2px;margin:0 -4px 0 -2px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overscroll-behavior:contain}
.more.sr{margin:0 0 12px}.srch{flex:1;min-width:180px;background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);font:inherit;font-size:14px}.srch:focus{outline:none;border-color:var(--acc)}
.q{margin:0 0 20px}.q h2{font:700 17px "Baloo 2",sans-serif;margin:0 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.op{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 14px;border:1px solid var(--line);border-radius:99px;font-size:14px}.op:hover{border-color:var(--acc)}
.op[aria-pressed=true]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,transparent)}
.chk{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:14px}.chk input{width:18px;height:18px;margin:0;accent-color:var(--acc)}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.th{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;font-size:14px}
.th:hover{border-color:var(--acc)}.th[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.th .sw{width:34px;height:34px;border-radius:9px;flex:none;background:var(--f) center/cover,var(--a);box-shadow:inset 0 -9px 0 var(--b),inset 0 -12px 0 var(--c)}
.nav{display:flex;align-items:center;gap:10px;margin-top:22px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;padding:11px 22px;border-radius:10px;background:var(--acc);color:var(--bg);font-weight:600}.btn:hover{background:var(--acc2)}
.btn[disabled]{opacity:.6;cursor:default}
.gh{all:unset;cursor:pointer;padding:10px 12px;color:var(--mute);border-radius:10px;font-size:14px}.gh:hover{color:var(--ink)}
.skip{margin-left:auto}
.msg{color:#ff8a80;font-size:14px;margin:10px 0 0}
.load{color:var(--mute);padding:30px 0}
@media (max-width:520px){.wz{padding:18px 16px 16px}.wz h1{font-size:24px}.cg{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><div class="hw"><a class="logo" href="/" aria-label="Jonin home"><span class="jc" aria-hidden="true"><i></i><i><b>J</b></i></span><span aria-hidden="true">ONIN</span></a></div></header>
<main><div class="wz" id="wz"><p class="load">Loading…</p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.min.js"></script>
<script>
{
const SUPA='https://cfzpayanhvvqtkuqfgof.supabase.co',SUPA_KEY='sb_publishable_ZR1zggWL9FxxwfwoIASwSg_YDV3Nvfe';
const $=s=>document.querySelector(s),wz=$('#wz');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Where to go after setup: the page they signed up on (set by the homepage before sending them here).
let RET='/';try{RET=sessionStorage.getItem('jret')||'/'}catch(_){}if(!RET.startsWith('/')||RET.startsWith('/welcome'))RET='/';
const MAXFAV=3;   // up to 3 favorite characters, first one = main favorite (David confirmed 2026-11-26)
// Setup questions and answers (David confirmed 2026-11-26).
const FOUND=[['reddit','Reddit'],['instagram','Instagram'],['facebook','Facebook group'],['search','Google / search'],['friend','A friend'],['other','Somewhere else']];
const TYPES=[['collector','Collector'],['player','Player'],['seller','Seller / vendor'],['investor','Investor'],['new','Just getting into it']];
let sb,USER,CHARS=[],STEP=0,Q='',A={fav:[],found:null,types:[],email:false,theme:null};
try{A.theme=localStorage.getItem('jtheme')||'jonin'}catch(_){A.theme='jonin'}

async function init(){
  if(!window.supabase){wz.innerHTML='<p class="msg">Could not load. Refresh the page.</p>';return}
  sb=window.supabase.createClient(SUPA,SUPA_KEY);
  const {data:{session}}=await sb.auth.getSession();
  if(!session){location.replace('/');return}
  USER=session.user;
  const [p,c]=await Promise.all([sb.from('profiles').select('fav_character,fav_characters,found_via,collector_types,email_updates,theme').eq('id',USER.id).maybeSingle(),fetch('/chars.json').then(r=>r.json()).catch(()=>[])]);
  CHARS=c;const pr=p.data||{};
  A.fav=(pr.fav_characters&&pr.fav_characters.length?pr.fav_characters:(pr.fav_character?[pr.fav_character]:[])).slice(0,MAXFAV);
  A.found=pr.found_via||null;A.types=pr.collector_types||[];A.email=!!pr.email_updates;if(pr.theme)A.theme=pr.theme;
  render();
}
const bar=()=>`<div class="top"><div class="steps" aria-hidden="true">${[0,1,2].map(i=>`<i class="${i<=STEP?'on':''}"></i>`).join('')}</div><small>Step ${STEP+1} of 3</small></div>`;
const nav=last=>`<div class="nav">${STEP?'<button class="gh" data-back>← Back</button>':''}<button class="btn" data-next>${last?'Done':'Next'}</button><button class="gh skip" data-skip>Skip for now</button></div><p class="msg" id="msg" hidden></p>`;
const chBtn=c=>{const i=A.fav.indexOf(c.slug);return `<button type="button" class="ch" data-fav="${esc(c.slug)}" aria-pressed="${i>=0}"><img src="/chars/${esc(c.slug)}.webp" alt="" width="52" height="52" loading="lazy">${esc(c.label)}${i>=0?`<span class="n">${i===0?'★':i+1}</span>`:''}</button>`};
// All 40 characters, most popular first, in a scrolling box with search on top (David, 2026-11-26).
function chList(){const q=Q.trim().toLowerCase();const l=q?CHARS.filter(c=>c.label.toLowerCase().includes(q)):CHARS;
  return l.length?l.map(chBtn).join(''):'<p class="mt">No character by that name.</p>'}
function paintChars(){const g=$('#cg');if(g)g.innerHTML=chList()}
function render(){
  if(STEP===0){
    wz.innerHTML=bar()+`<h1>Who are your favorites?</h1><p class="mt">Pick up to ${MAXFAV}. Your first pick (★) becomes your profile picture.</p>
    <div class="more sr"><input class="srch" id="srch" type="search" placeholder="Search all ${CHARS.length} characters" value="${esc(Q)}" autocomplete="off"></div>
    <div class="cbox"><div class="cg" id="cg">${chList()}</div></div>`+nav(false);
  }else if(STEP===1){
    const op=(k,l,on,attr)=>`<button type="button" class="op" ${attr}="${k}" aria-pressed="${on}">${esc(l)}</button>`;
    wz.innerHTML=bar()+`<h1>A couple of questions</h1><p class="mt">Optional.</p>
    <div class="q"><h2>How did you find Jonin?</h2><div class="opts">${FOUND.map(([k,l])=>op(k,l,A.found===k,'data-found')).join('')}</div></div>
    <div class="q"><h2>What describes you?</h2><div class="opts">${TYPES.map(([k,l])=>op(k,l,A.types.includes(k),'data-type')).join('')}</div></div>
    <label class="chk"><input type="checkbox" id="em"${A.email?' checked':''}><span>Email me Naruto CCG news and top sales (now and then)</span></label>`+nav(false);
  }else{
    const T=window.JONIN_THEMES||[];
    wz.innerHTML=bar()+`<h1>Pick a theme</h1><p class="mt">You can change it anytime at the top of the site.</p>
    <div class="tg">${T.map(t=>`<button type="button" class="th" data-th="${esc(t.id)}" aria-pressed="${t.id===A.theme}" title="${esc(t.d)}"><span class="sw" style="--a:${t.bg};--b:${t.a};--c:${t.c};--f:url('${t.f}')"></span>${esc(t.n)}</button>`).join('')}</div>`+nav(true);
  }
}
// Pressing an option only repaints that part, so the page doesn't jump.
const press=(sel,on)=>document.querySelectorAll(sel).forEach(b=>b.setAttribute('aria-pressed',on(b)));
async function save(done){
  const row={setup_done_at:new Date().toISOString()};
  Object.assign(row,{fav_characters:A.fav,fav_character:A.fav[0]||null,found_via:A.found,collector_types:A.types,email_updates:A.email,theme:A.theme});
  const r=await sb.from('profiles').update(row).eq('id',USER.id);
  if(r.error){const m=$('#msg');m.hidden=false;m.textContent='Could not save: '+r.error.message;return false}
  try{sessionStorage.removeItem('jret')}catch(_){}
  location.replace(RET);return true;
}
wz.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.fav){const s=t.dataset.fav,i=A.fav.indexOf(s);if(i>=0)A.fav.splice(i,1);else if(A.fav.length<MAXFAV)A.fav.push(s);else{A.fav[MAXFAV-1]=s}paintChars()}
  else if(t.dataset.found){A.found=A.found===t.dataset.found?null:t.dataset.found;press('[data-found]',b=>b.dataset.found===A.found)}
  else if(t.dataset.type){const k=t.dataset.type,i=A.types.indexOf(k);if(i>=0)A.types.splice(i,1);else A.types.push(k);press('[data-type]',b=>A.types.includes(b.dataset.type))}
  else if(t.dataset.th){A.theme=t.dataset.th;if(window.joninSetTheme)joninSetTheme(A.theme);press('[data-th]',b=>b.dataset.th===A.theme)}
  else if(t.hasAttribute('data-back')){STEP--;render();window.scrollTo(0,0)}
  else if(t.hasAttribute('data-next')){if(STEP<2){STEP++;render();window.scrollTo(0,0)}else{t.disabled=true;if(!await save(true))t.disabled=false}}
  else if(t.hasAttribute('data-skip')){t.disabled=true;if(!await save(false))t.disabled=false}
});
wz.addEventListener('change',e=>{if(e.target.id==='em')A.email=e.target.checked});
wz.addEventListener('input',e=>{if(e.target.id==='srch'){Q=e.target.value;paintChars()}});
init();
}
</script>
</body>
</html>
