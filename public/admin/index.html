<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accounts, members, waitlist, sales &amp; feedback — Jonin admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1B1622;--panel:#241E2D;--line:#352C40;--ink:#FFF4E6;--mute:#B8AEA6;--acc:#F57C00;--acc2:#FF9A3D;--red:#B5121B;--ok:#6CC24A}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}
a{color:var(--acc)}
header{border-bottom:1px solid #2E2638}.hw{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px}
.logo{display:flex;align-items:center;gap:.06em;font:800 28px/1 "Baloo 2",sans-serif;color:var(--ink);text-decoration:none}.logo .jc{position:relative;height:1.42cap;width:1.02cap;flex:none;margin-right:.06em}.logo .jc i{position:absolute;inset:0;border-radius:.1em;box-shadow:.05em .05em 0 #0A080D}.logo .jc i:first-child{background:var(--acc);transform:rotate(10deg) translate(.2em,-.06em)}.logo .jc i:last-child{background:var(--red);transform:rotate(-8deg);display:flex;align-items:center;justify-content:center;font-style:normal;color:var(--ink)}.logo .jc b{text-box:trim-both cap alphabetic;margin-left:-.03em}.logo>span:last-child{text-box:trim-both cap alphabetic}
main{max-width:1120px;margin:0 auto;padding:32px 20px 72px}
h1{font:800 40px/1.05 "Baloo 2",sans-serif;margin:0 0 6px}h2{font:800 22px "Baloo 2",sans-serif;margin:28px 0 10px}
.mt{color:var(--mute);margin:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
form.grant{display:grid;grid-template-columns:2fr 1fr 2fr auto;gap:10px;align-items:end}
@media(max-width:760px){form.grant{grid-template-columns:1fr}}
label span{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
input{width:100%;min-height:42px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:15px Inter,sans-serif}
input:focus{outline:none;border-color:var(--acc)}
button{min-height:42px;padding:8px 16px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#1B1622;font:600 14px Inter,sans-serif;cursor:pointer}
button.ghost{background:none;color:var(--mute);border-color:var(--line);min-height:32px;padding:4px 10px}button.ghost:hover{color:var(--ink);border-color:#a33}
.msg{margin:10px 0 0;font-size:14px}.msg.err{color:#ff8a80}.msg.ok{color:var(--ok)}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:18px 0}.stats b{display:block;font:800 30px/1 "Baloo 2",sans-serif;color:var(--acc)}.stats span{color:var(--mute);font-size:13px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-weight:600;color:var(--mute);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.st{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:#2E2638}.st.active{background:#1F3A1A;color:var(--ok)}.st.invited{background:#3A2A10;color:var(--acc2)}.st.revoked,.st.expired{color:var(--mute)}
.tag{font-size:12px;color:var(--mute)}
.fbp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:rgba(242,193,78,.06)}.fbch{padding:6px 0;border-top:1px dashed var(--line)}.fbdel{color:#ff8a80}.fbadd{color:var(--ok)}.fbalt[hidden]{display:none!important}
.gate{max-width:440px}
.mn{display:inline-block;margin-left:6px;min-width:18px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font:700 11px/18px Inter,sans-serif;text-align:center}
.mrow{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}.mrow:hover{background:#2B2435}.mrow:last-child{border-bottom:0}
.mrow img,.mrow .mi{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--bg);flex:none;display:grid;place-items:center;font-weight:700}
.mrow .mb{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--mute);font-size:13px}.mrow.un .mb{color:var(--ink);font-weight:600}
.th{display:grid;gap:8px;max-height:46vh;overflow:auto;padding:4px 2px;margin:10px 0}
.bb{max-width:80%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;font-size:14px}.bb.me{justify-self:end;background:#3A2A10;border:1px solid #5A4318}.bb.them{justify-self:start;background:var(--bg);border:1px solid var(--line)}
.bb .tag{display:block;margin-top:4px;font-size:11px}.bb .use{margin-top:6px;min-height:28px;padding:2px 10px;font-size:12px}
.tnote{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:6px}
textarea{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:15px/1.45 Inter,sans-serif;resize:vertical}textarea:focus{outline:none;border-color:var(--acc)}
form.psale{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}form.psale .wide{grid-column:span 2}
@media(max-width:760px){form.psale{grid-template-columns:1fr 1fr}form.psale .wide{grid-column:1/-1}}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}.jump a{padding:6px 12px;border:1px solid var(--line);border-radius:99px;color:var(--mute);text-decoration:none;font-size:13px}.jump a:hover{color:var(--ink);border-color:var(--acc)}
h2.big{font-size:30px;margin-top:40px}#acc h2.big{margin-top:24px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}.fs{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}.fs b{font:800 18px "Baloo 2",sans-serif;color:#F2C14E;margin-right:6px}.fs.open{border-style:dashed;color:var(--mute)}.fs .tag{display:block}
.st.f{background:#3A2E10;color:#F2C14E}
select{width:100%;min-height:42px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:15px Inter,sans-serif}
</style>
</head>
<body>
<header><div class="hw"><a class="logo" href="/" aria-label="Jonin home"><span class="jc" aria-hidden="true"><i></i><i><b>J</b></i></span><span aria-hidden="true">ONIN</span></a><span class="tag">Admin</span></div></header>
<main>
  <h1>Jonin admin</h1>
  <nav class="jump" id="jump" hidden><a href="#acc">Accounts</a><a href="#founders">Founding members</a><a href="#prem">Jonin Club members</a><a href="#wl">Waitlist</a><a href="#ps">Add a sale</a><a href="#fb">Feedback</a><a href="#msg">Messages<b id="msgn" class="mn" hidden></b></a></nav>
  <section id="acc"></section>
  <h2 id="prem" class="big" hidden>Jonin Club members</h2>
  <p class="mt" id="premnote" hidden>Everyone with Jonin Club, free or paid. Give it to anyone by email; if they don't have an account yet, it turns on when they sign up with that email.</p>
  <div id="app"><p class="mt" style="margin-top:20px">Loading…</p></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.min.js"></script>
<script>
{
const SUPA='https://cfzpayanhvvqtkuqfgof.supabase.co',SUPA_KEY='sb_publishable_ZR1zggWL9FxxwfwoIASwSg_YDV3Nvfe';
const $=s=>document.querySelector(s),app=$('#app');
if(!window.supabase){app.innerHTML='<p class="msg err">Could not load. Refresh the page.</p>';throw new Error('supabase-js missing')}
const sb=window.supabase.createClient(SUPA,SUPA_KEY);

const day=d=>d?new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
function gate(msg){app.innerHTML=`<div class="box gate" style="margin-top:20px"><p style="margin-top:0">${esc(msg)}</p><form id="login"><label><span>Email</span><input name="e" type="email" required autocomplete="email"></label><label style="display:block;margin-top:10px"><span>Password</span><input name="p" type="password" required autocomplete="current-password"></label><button style="margin-top:12px">Sign in</button><p class="msg" id="lm"></p></form></div>`;
  $('#login').onsubmit=async ev=>{ev.preventDefault();const f=ev.target;const r=await sb.auth.signInWithPassword({email:f.e.value.trim(),password:f.p.value});if(r.error){$('#lm').className='msg err';$('#lm').textContent=r.error.message}else load()}}
async function load(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return gate('Sign in with your Jonin account to manage members.');
  const {data:adm}=await sb.rpc('is_admin');

  loadAcc();$('#jump').hidden=false;$('#prem').hidden=false;$('#premnote').hidden=false;
  const {data,error}=await sb.rpc('admin_members');
  if(error){app.innerHTML=`<p class="msg err">${esc(error.message)}</p>`;return}
  const rows=data||[],n=s=>rows.filter(r=>r.status.startsWith(s)).length;
  app.innerHTML=`<div class="stats"><div><b>${n('active')}</b><span>Active</span></div><div><b>${rows.filter(r=>r.status==='active'&&r.source==='free').length}</b><span>Free</span></div><div><b>${rows.filter(r=>r.status==='active'&&r.source==='paid').length}</b><span>Paid</span></div><div><b>${n('invited')}</b><span>Invited, no account yet</span></div></div>
  <h2>Give Jonin Club free</h2>
  <form class="grant box" id="grant"><label><span>Email</span><input name="e" type="email" required placeholder="collector@email.com"></label><label><span>Ends (optional)</span><input name="u" type="date"></label><label><span>Note (optional)</span><input name="n" placeholder="e.g. WE ARE EARLY tester"></label><button>Give Jonin Club</button></form>
  <p class="msg" id="gm"></p>
  <h2>Members</h2>
  <div class="tw box" style="padding:0"><table><thead><tr><th>Email</th><th>Status</th><th>Free / paid</th><th>Since</th><th>Ends</th><th>Note</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.email)}${r.handle?`<div class="tag">@${esc(r.handle)}</div>`:''}</td><td><span class="st ${esc(r.status.split(' ')[0])}">${esc(r.status)}</span></td><td>${esc(r.source)}${r.founding?' <span class="tag">· founding</span>':''}</td><td>${day(r.since)}</td><td>${r.until?day(r.until):'<span class="tag">never</span>'}</td><td>${esc(r.note||'')}</td><td>${r.status==='revoked'?`<button class="ghost" data-give="${esc(r.email)}">Restore</button>`:`<button class="ghost" data-rev="${esc(r.email)}">${r.status.startsWith('invited')?'Cancel invite':'Remove'}</button>`}</td></tr>`).join('')||'<tr><td colspan="7" class="tag">No members yet.</td></tr>'}</tbody></table></div>
  <p class="mt" style="margin-top:14px;font-size:13px">Signed in as ${esc(session.user.email)} · <a href="#" id="out">Sign out</a></p>`;
  $('#grant').onsubmit=async ev=>{ev.preventDefault();const f=ev.target;const until=f.u.value?new Date(f.u.value+'T23:59:59').toISOString():null;
    const r=await sb.rpc('admin_grant',{p_email:f.e.value,p_until:until,p_note:f.n.value.trim()||null});const m=$('#gm');
    if(r.error){m.className='msg err';m.textContent=r.error.message;return}
    await load();const m2=$('#gm');m2.className='msg ok';m2.textContent=r.data==='invited'?`${f.e.value} has no account yet. Jonin Club turns on when they sign up with that email.`:`Jonin Club is on for ${f.e.value}.`};
  app.querySelectorAll('[data-rev]').forEach(b=>b.onclick=async()=>{if(!confirm('Remove Jonin Club from '+b.dataset.rev+'?'))return;const r=await sb.rpc('admin_revoke',{p_email:b.dataset.rev});if(r.error)alert(r.error.message);load()});
  app.querySelectorAll('[data-give]').forEach(b=>b.onclick=async()=>{const r=await sb.rpc('admin_grant',{p_email:b.dataset.give,p_until:null,p_note:null});if(r.error)alert(r.error.message);load()});
  $('#out').onclick=async e=>{e.preventDefault();await sb.auth.signOut();load()};
  loadWl();
  loadPs();
  loadFb();
  loadMsg();
}
// Accounts: everyone who made an account, plus the founding members (first 20 non-admin sign-ups get Jonin Club free forever).
const ago=d=>{if(!d)return '';const m=Math.round((Date.now()-new Date(d))/6e4);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
const when=d=>d?new Date(d).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';
const FOUNDL={reddit:'Reddit',instagram:'Instagram',facebook:'Facebook group',search:'Google / search',friend:'A friend',other:'Somewhere else'},TYPEL={collector:'Collector',player:'Player',seller:'Seller / vendor',investor:'Investor',new:'New to it'};
const cap=s=>String(s||'').split('-').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
function setupCell(x){if(!x.setup_done_at)return '<span class="tag">not done yet</span>';const bits=[];
  if(x.found_via)bits.push('Found via <b>'+esc(FOUNDL[x.found_via]||x.found_via)+'</b>');if(x.collector_types&&x.collector_types.length)bits.push(esc(x.collector_types.map(t=>TYPEL[t]||t).join(', ')));
  if(x.fav_characters&&x.fav_characters.length)bits.push('Favs: '+esc(x.fav_characters.map(cap).join(', ')));if(x.email_updates)bits.push('✉ wants emails');
  return bits.length?bits.map(b=>`<div class="tag" style="color:var(--ink)">${b}</div>`).join(''):'<span class="tag">skipped</span>'}
async function loadAcc(){const el=$('#acc');const r=await sb.rpc('admin_accounts');
  if(r.error){el.innerHTML=`<h2 class="big">Accounts</h2><p class="msg err">${esc(r.error.message)}</p>`;return}
  const rows=r.data||[],real=rows.filter(x=>!x.is_admin),day1=real.filter(x=>new Date(x.created_at)>Date.now()-864e5).length,wk=real.filter(x=>new Date(x.created_at)>Date.now()-7*864e5).length;
  const fnd=real.filter(x=>x.founding&&x.founder_no).sort((a,b)=>a.founder_no-b.founder_no),TOTAL=20;
  const who=x=>x.handle?`@${esc(x.handle)}`:esc(x.email);
  const slots=Array.from({length:TOTAL},(_,i)=>{const x=fnd.find(f=>f.founder_no===i+1);return x?`<div class="fs"><b>#${i+1}</b>${who(x)}<span class="tag">${esc(x.email)}</span><span class="tag">joined ${when(x.created_at)}</span></div>`:`<div class="fs open"><b>#${i+1}</b>open</div>`}).join('');
  el.innerHTML=`<h2 class="big">Accounts</h2>
  <div class="stats"><div><b>${real.length}</b><span>Accounts (not counting you)</span></div><div><b>${day1}</b><span>Joined last 24 hours</span></div><div><b>${wk}</b><span>Joined last 7 days</span></div><div><b>${real.filter(x=>x.last_seen_at&&new Date(x.last_seen_at)>Date.now()-864e5).length}</b><span>Active last 24 hours</span></div><div><b>${real.filter(x=>x.last_seen_at&&new Date(x.last_seen_at)>Date.now()-7*864e5).length}</b><span>Active last 7 days</span></div><div><b>${fnd.length}/${TOTAL}</b><span>Founding spots taken</span></div><div><b>${real.filter(x=>x.email_updates).length}</b><span>Want emails</span></div></div>${(()=>{const t={};real.forEach(x=>{if(x.found_via)t[x.found_via]=(t[x.found_via]||0)+1});const k=Object.keys(t).sort((a,b)=>t[b]-t[a]);return k.length?`<p class="mt" style="margin:-6px 0 6px">How people found Jonin: ${k.map(f=>`<b style="color:var(--ink)">${esc(FOUNDL[f]||f)}</b> ${t[f]}`).join(' · ')}</p>`:''})()}
  <h2 id="founders">Founding members</h2><p class="mt" style="margin-bottom:10px">The first ${TOTAL} people to make an account get Jonin Club free, forever. ${Math.max(0,TOTAL-fnd.length)} spots left. New sign-ups fill the next spot automatically.${fnd.length?' <button class="ghost" id="fcopy">Copy founder emails</button>':''}</p>
  <div class="fgrid">${slots}</div>
  <h2>Everyone who made an account</h2><p class="mt" style="margin-bottom:10px">Newest first.${real.length?' <button class="ghost" id="acopy">Copy all emails</button>':''}</p>
  <div class="tw box" style="padding:0"><table><thead><tr><th>Account</th><th>Joined</th><th>Last seen</th><th>Signed up with</th><th>Jonin Club</th><th>Collection</th><th>Setup answers</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.handle?`@${esc(x.handle)}<div class="tag">${esc(x.email)}</div>`:esc(x.email)}${x.is_admin?'<div class="tag">you (admin)</div>':''}</td><td>${when(x.created_at)}<div class="tag">${ago(x.created_at)}</div></td><td>${x.last_seen_at?`${ago(x.last_seen_at)}<div class="tag">${when(x.last_seen_at)}</div>`:'<span class="tag">never</span>'}${x.last_sign_in_at?`<div class="tag">signed in ${when(x.last_sign_in_at)}</div>`:''}</td><td>${x.provider==='google'?'Google':x.provider==='discord'?'Discord':x.provider==='email'?'Email':esc(x.provider)}</td><td>${x.founding&&x.founder_no?`<span class="st f">⭐ Founder #${x.founder_no}</span>`:x.premium==='active'?'<span class="st active">active</span>':`<span class="tag">${x.premium==='none'?'—':esc(x.premium)}</span>`}</td><td>${x.cards_have?`${x.cards_have} card${x.cards_have===1?'':'s'}`:'<span class="tag">none yet</span>'}${x.slabs?`<div class="tag">${x.slabs} slab${x.slabs===1?'':'s'}</div>`:''}${x.cards_have||x.slabs?`<button class="ghost" data-view="${esc(x.email)}" style="margin-top:4px">View profile</button> <button class="ghost" data-dm="${esc(x.email)}" style="margin-top:4px">💬 Message</button>`:''}</td><td>${setupCell(x)}</td></tr>`).join('')||'<tr><td colspan="7" class="tag">No accounts yet.</td></tr>'}</tbody></table></div>`;
  el.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>viewUser(b.dataset.view));
  el.querySelectorAll('[data-dm]').forEach(b=>b.onclick=()=>openThread({email:b.dataset.dm}));
  const fc=$('#fcopy');if(fc)fc.onclick=async()=>{await navigator.clipboard.writeText(fnd.map(x=>x.email).join(', '));fc.textContent='Copied ✓'};
  const ac=$('#acopy');if(ac)ac.onclick=async()=>{await navigator.clipboard.writeText(real.map(x=>x.email).join(', '));ac.textContent='Copied ✓'};
}
// Jonin Club waitlist: emails from the "Get early access" form on /club/ (and card pages' alert buttons).

  const [cards,r]=await Promise.all([cardsList().catch(()=>[]),sb.rpc('admin_waitlist')]);

  const rows=r.data||[],names=Object.fromEntries(cards.map(c=>[c.id,c.label])),wk=rows.filter(x=>new Date(x.last_at)>Date.now()-7*864e5).length;
  el.innerHTML=`<h2>Jonin Club waitlist</h2><p class="mt" style="margin-bottom:10px">People who asked for early access on the Jonin Club page. <b style="color:var(--ink)">${rows.length}</b> ${rows.length===1?'person':'people'} · ${wk} in the last 7 days.${rows.length?' <button class="ghost" id="wlcopy">Copy all emails</button>':''}</p>

// Add a sale: sales David enters by hand from any source (ALT, Fanatics Collect, eBay, private...). They count everywhere
// a collected eBay sale does (price bands, Jonin Club estimates, most-valuable pages) once the site syncs (every ~15 min).
// Each sale's {{sale ID}} code drops it into an article (pipeline/articles/*.md).
let CARDS=null;const SRCS=['Private','ALT','Fanatics Collect','eBay','Goldin','Heritage','PWCC','Card show','Other'];
// View profile (2026-11-26): admin-only look at one account's profile, slabs (with certs), haves, wants and lists.

// Accept applies card-data fixes (admin_feedback_review) and gives the sender feedback scrolls (xp_rules). Undo puts it back.
async function loadFb(){const [r,mc]=await Promise.all([sb.rpc('admin_feedback'),sb.rpc('admin_note_message_counts')]);MSGN=Object.fromEntries((mc.data||[]).map(x=>[x.feedback_id,x.n+(x.unread?', '+x.unread+' new':'')]));let el=$('#fb');if(!el){app.insertAdjacentHTML('beforeend','<div id="fb"></div>');el=$('#fb')}

  const open=x=>['drafting','awaiting','alter'].includes(x.review)&&x.status!=='archived';
  const F={review:open,accepted:x=>x.review==='accepted',skipped:x=>x.review==='skipped',all:x=>x.status!=='archived'};
  const rows=all.filter(F[FBSHOW]),cnt=k=>all.filter(F[k]).length;
  const ids=[...new Set(rows.flatMap(x=>(x.proposal_change||[]).map(c=>c.card_id)).concat(rows.map(x=>x.card_id)).filter(Boolean))];
  const cr=ids.length?await sb.from('cards').select('id,name,number,set_id,printings,editions,rarity').in('id',ids):{data:[]};
  const CB=Object.fromEntries((cr.data||[]).map(c=>[c.id,c]));

  const diff=(b,a)=>{const B=lst(b),A=lst(a);return B.filter(x=>!A.includes(x)).map(x=>`<s class="fbdel">${esc(x)}</s>`).concat(A.map(x=>B.includes(x)?esc(x):`<b class="fbadd">${esc(x)}</b>`)).join(', ')||'<span class="tag">none</span>'};
  const changeHtml=(x)=>{const ch=x.proposal_change||[];if(!ch.length)return'';const before=x.review==='accepted'&&x.applied?Object.fromEntries(x.applied.map(c=>[c.id,c])):CB;
    const shown=ch.slice(0,6).map(c=>{const b=before[c.card_id]||{};return`<div class="fbch"><div><a href="/#card=${encodeURIComponent(c.card_id)}" target="_blank">${esc(b.name||c.card_id)}</a> <span class="tag">${esc(c.card_id)}</span></div>${Object.entries(c.set||{}).map(([k,v])=>`<div class="tag" style="margin-top:2px"><b style="color:var(--ink)">${esc(k)}:</b> ${diff(b[k],v)}</div>`).join('')}</div>`}).join('');
    return shown+(ch.length>6?`<p class="tag">…and ${ch.length-6} more cards (${ch.length} in all)</p>`:'')};
  const card=x=>`<div class="box fbn" style="margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span class="tag">${day(x.created_at)} · ${K[x.kind]||esc(x.kind)}${x.card_id?` · <a href="/#card=${encodeURIComponent(x.card_id)}" target="_blank">${esc((CB[x.card_id]||{}).name||x.card_id)}</a>`:''}${x.page?` · <a href="${esc(x.page.split('#')[0]+(x.selector?(x.page.includes('?')?'&':'?')+'fbspot='+encodeURIComponent(x.selector):''))}" target="_blank">page</a>`:''}</span>
    <span class="tag">${esc(x.name||'')} ${x.contact?esc(x.contact):''}${!x.name&&!x.contact?'anonymous':''}${x.user_id?' · signed in':''}</span></div>
    <div style="white-space:pre-wrap;margin:8px 0 10px;font-size:15px">“${esc(x.message)}”</div>
    ${x.user_id||x.credit_user||x.contact?`<p style="margin:-4px 0 10px"><button class="ghost" data-fbdm="${x.id}">💬 ${MSGN[x.id]?'Conversation ('+MSGN[x.id]+')':'Message sender'}</button></p>`:''}
    ${x.review==='drafting'?`<p class="tag">Claude is drafting a fix (checked every hour).</p>`:''}
    ${x.review==='alter'?`<p class="tag"><b style="color:var(--ink)">Your change:</b> ${esc(x.alter_note)}<br>Claude is redrafting (checked every hour).</p>`:''}
    ${x.proposal&&x.review!=='drafting'?`<div class="fbp"><div class="tag" style="letter-spacing:1px;font-weight:700">PROPOSED FIX</div><div style="margin:4px 0 6px">${esc(x.proposal)}</div>${changeHtml(x)}${x.proposal_question&&x.review!=='accepted'?`<p class="tag" style="margin-top:8px">❓ ${esc(x.proposal_question)}</p>`:''}</div>`:''}
    ${x.review==='awaiting'?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button data-fbr="accept" data-id="${x.id}">✓ Accept${x.proposal_change?' & apply':''} (+📜)</button><button class="ghost" data-fbr="alter" data-id="${x.id}">✎ Alter</button><button class="ghost" data-fbr="skip" data-id="${x.id}">Skip</button></div>
      <form class="fbalt" data-id="${x.id}" hidden style="margin-top:8px;display:grid;gap:6px"><textarea name="t" rows="2" placeholder="What should change? e.g. apply to all rares in this set" style="width:100%;box-sizing:border-box"></textarea><div><button type="submit">Send to Claude</button></div></form>`:''}
    ${x.review==='accepted'?`<p class="tag" style="margin-top:8px">✓ Accepted ${day(x.reviewed_at)}${x.applied?` · ${x.applied.length} card${x.applied.length>1?'s':''} updated (on the site within ~15 min)`:''} · ${x.credit_user?'Scrolls given':'Scrolls waiting (no account with that email yet; it\'s given if they sign up with it)'} <button class="ghost" data-fbundo="${x.id}">Undo</button></p>`:''}
    ${x.review==='skipped'?`<p class="tag">Skipped ${day(x.reviewed_at)}</p>`:''}
  </div>`;
  el.innerHTML=`<h2>Feedback</h2><p class="mt" style="margin-bottom:10px">${[['review','To review'],['accepted','Accepted'],['skipped','Skipped'],['all','All']].map(([k,l])=>`<button class="ghost" data-fbs="${k}" style="${FBSHOW===k?'color:var(--ink);border-color:var(--acc)':''}">${l}${k!=='all'?' ('+cnt(k)+')':''}</button>`).join(' ')}</p>
  ${rows.length?rows.map(card).join(''):'<p class="tag">Nothing here.</p>'}`;
  el.querySelectorAll('[data-fbs]').forEach(b=>b.onclick=()=>{FBSHOW=b.dataset.fbs;loadFb()});
  el.querySelectorAll('[data-fbdm]').forEach(b=>b.onclick=()=>openThread({feedback:+b.dataset.fbdm}));
  const act=async(id,a,note)=>{const r=await sb.rpc('admin_feedback_review',{p_id:id,p_action:a,p_note:note||null});if(r.error){alert(r.error.message);return}loadFb()};
  el.querySelectorAll('[data-fbr]').forEach(b=>b.onclick=()=>{const id=+b.dataset.id;if(b.dataset.fbr==='alter'){const f=el.querySelector(`.fbalt[data-id="${id}"]`);f.hidden=!f.hidden;if(!f.hidden)f.t.focus();return}
    b.disabled=true;act(id,b.dataset.fbr)});
  el.querySelectorAll('.fbalt').forEach(f=>f.onsubmit=e=>{e.preventDefault();const t=f.t.value.trim();if(!t){f.t.focus();return}act(+f.dataset.id,'alter',t)});
  el.querySelectorAll('[data-fbundo]').forEach(b=>b.onclick=async()=>{if(!confirm('Undo this? The cards go back to how they were and the scrolls are taken away.'))return;const r=await sb.rpc('admin_feedback_undo',{p_id:+b.dataset.fbundo});if(r.error)alert(r.error.message);loadFb()});
}
load();
}
</script>
</body>
</html>
