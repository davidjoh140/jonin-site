<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Members, waitlist, sales &amp; feedback — Jonin admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1B1622;--panel:#241E2D;--line:#352C40;--ink:#FFF4E6;--mute:#B8AEA6;--acc:#F57C00;--acc2:#FF9A3D;--red:#B5121B;--ok:#6CC24A}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}
a{color:var(--acc)}
header{border-bottom:1px solid #2E2638}.hw{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px}
.logo{display:flex;align-items:center;gap:.06em;font:800 28px/1 "Baloo 2",sans-serif;color:var(--ink);text-decoration:none}.logo .jc{position:relative;height:1.42cap;width:1.02cap;flex:none;margin-right:.06em}.logo .jc i{position:absolute;inset:0;border-radius:.1em;box-shadow:.05em .05em 0 #0A080D}.logo .jc i:first-child{background:var(--acc);transform:rotate(10deg) translate(.2em,-.06em)}.logo .jc i:last-child{background:var(--red);transform:rotate(-8deg);display:flex;align-items:center;justify-content:center;font-style:normal;color:var(--ink)}.logo .jc b{text-box:trim-both cap alphabetic;margin-left:-.03em}.logo>span:last-child{text-box:trim-both cap alphabetic}
main{max-width:1120px;margin:0 auto;padding:32px 20px 72px}
h1{font:800 40px/1.05 "Baloo 2",sans-serif;margin:0 0 6px}h2{font:800 22px "Baloo 2",sans-serif;margin:28px 0 10px}
.mt{color:var(--mute);margin:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
form.grant{display:grid;grid-template-columns:2fr 1fr 2fr auto;gap:10px;align-items:end}
@media(max-width:760px){form.grant{grid-template-columns:1fr}}
label span{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
input{width:100%;min-height:42px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:15px Inter,sans-serif}
input:focus{outline:none;border-color:var(--acc)}
button{min-height:42px;padding:8px 16px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#1B1622;font:600 14px Inter,sans-serif;cursor:pointer}
button.ghost{background:none;color:var(--mute);border-color:var(--line);min-height:32px;padding:4px 10px}button.ghost:hover{color:var(--ink);border-color:#a33}
.msg{margin:10px 0 0;font-size:14px}.msg.err{color:#ff8a80}.msg.ok{color:var(--ok)}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:18px 0}.stats b{display:block;font:800 30px/1 "Baloo 2",sans-serif;color:var(--acc)}.stats span{color:var(--mute);font-size:13px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-weight:600;color:var(--mute);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.st{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:#2E2638}.st.active{background:#1F3A1A;color:var(--ok)}.st.invited{background:#3A2A10;color:var(--acc2)}.st.revoked,.st.expired{color:var(--mute)}
.tag{font-size:12px;color:var(--mute)}
.gate{max-width:440px}
form.psale{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}form.psale .wide{grid-column:span 2}
@media(max-width:760px){form.psale{grid-template-columns:1fr 1fr}form.psale .wide{grid-column:1/-1}}
select{width:100%;min-height:42px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:15px Inter,sans-serif}
</style>
</head>
<body>
<header><div class="hw"><a class="logo" href="/" aria-label="Jonin home"><span class="jc" aria-hidden="true"><i></i><i><b>J</b></i></span><span aria-hidden="true">ONIN</span></a><span class="tag">Admin</span></div></header>
<main>
  <h1>Premium members</h1>
  <p class="mt">Everyone with Premium, free or paid. Give it to anyone by email; if they don't have an account yet, it turns on when they sign up with that email.</p>
  <div id="app"><p class="mt" style="margin-top:20px">Loading…</p></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.min.js"></script>
<script>
{
const SUPA='https://cfzpayanhvvqtkuqfgof.supabase.co',SUPA_KEY='sb_publishable_ZR1zggWL9FxxwfwoIASwSg_YDV3Nvfe';
const $=s=>document.querySelector(s),app=$('#app');
if(!window.supabase){app.innerHTML='<p class="msg err">Could not load. Refresh the page.</p>';throw new Error('supabase-js missing')}
const sb=window.supabase.createClient(SUPA,SUPA_KEY);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=d=>d?new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
function gate(msg){app.innerHTML=`<div class="box gate" style="margin-top:20px"><p style="margin-top:0">${esc(msg)}</p><form id="login"><label><span>Email</span><input name="e" type="email" required autocomplete="email"></label><label style="display:block;margin-top:10px"><span>Password</span><input name="p" type="password" required autocomplete="current-password"></label><button style="margin-top:12px">Sign in</button><p class="msg" id="lm"></p></form></div>`;
  $('#login').onsubmit=async ev=>{ev.preventDefault();const f=ev.target;const r=await sb.auth.signInWithPassword({email:f.e.value.trim(),password:f.p.value});if(r.error){$('#lm').className='msg err';$('#lm').textContent=r.error.message}else load()}}
async function load(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return gate('Sign in with your Jonin account to manage members.');
  const {data:adm}=await sb.rpc('is_admin');
  if(!adm)return gate('This account doesn\'t have admin access. Sign in with the owner account.');
  const {data,error}=await sb.rpc('admin_members');
  if(error){app.innerHTML=`<p class="msg err">${esc(error.message)}</p>`;return}
  const rows=data||[],n=s=>rows.filter(r=>r.status.startsWith(s)).length;
  app.innerHTML=`<div class="stats"><div><b>${n('active')}</b><span>Active</span></div><div><b>${rows.filter(r=>r.status==='active'&&r.source==='free').length}</b><span>Free</span></div><div><b>${rows.filter(r=>r.status==='active'&&r.source==='paid').length}</b><span>Paid</span></div><div><b>${n('invited')}</b><span>Invited, no account yet</span></div></div>
  <h2>Give Premium free</h2>
  <form class="grant box" id="grant"><label><span>Email</span><input name="e" type="email" required placeholder="collector@email.com"></label><label><span>Ends (optional)</span><input name="u" type="date"></label><label><span>Note (optional)</span><input name="n" placeholder="e.g. WE ARE EARLY tester"></label><button>Give Premium</button></form>
  <p class="msg" id="gm"></p>
  <h2>Members</h2>
  <div class="tw box" style="padding:0"><table><thead><tr><th>Email</th><th>Status</th><th>Free / paid</th><th>Since</th><th>Ends</th><th>Note</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.email)}${r.handle?`<div class="tag">@${esc(r.handle)}</div>`:''}</td><td><span class="st ${esc(r.status.split(' ')[0])}">${esc(r.status)}</span></td><td>${esc(r.source)}${r.founding?' <span class="tag">· founding</span>':''}</td><td>${day(r.since)}</td><td>${r.until?day(r.until):'<span class="tag">never</span>'}</td><td>${esc(r.note||'')}</td><td>${r.status==='revoked'?`<button class="ghost" data-give="${esc(r.email)}">Restore</button>`:`<button class="ghost" data-rev="${esc(r.email)}">${r.status.startsWith('invited')?'Cancel invite':'Remove'}</button>`}</td></tr>`).join('')||'<tr><td colspan="7" class="tag">No members yet.</td></tr>'}</tbody></table></div>
  <p class="mt" style="margin-top:14px;font-size:13px">Signed in as ${esc(session.user.email)} · <a href="#" id="out">Sign out</a></p>`;
  $('#grant').onsubmit=async ev=>{ev.preventDefault();const f=ev.target;const until=f.u.value?new Date(f.u.value+'T23:59:59').toISOString():null;
    const r=await sb.rpc('admin_grant',{p_email:f.e.value,p_until:until,p_note:f.n.value.trim()||null});const m=$('#gm');
    if(r.error){m.className='msg err';m.textContent=r.error.message;return}
    await load();const m2=$('#gm');m2.className='msg ok';m2.textContent=r.data==='invited'?`${f.e.value} has no account yet. Premium turns on when they sign up with that email.`:`Premium is on for ${f.e.value}.`};
  app.querySelectorAll('[data-rev]').forEach(b=>b.onclick=async()=>{if(!confirm('Remove Premium from '+b.dataset.rev+'?'))return;const r=await sb.rpc('admin_revoke',{p_email:b.dataset.rev});if(r.error)alert(r.error.message);load()});
  app.querySelectorAll('[data-give]').forEach(b=>b.onclick=async()=>{const r=await sb.rpc('admin_grant',{p_email:b.dataset.give,p_until:null,p_note:null});if(r.error)alert(r.error.message);load()});
  $('#out').onclick=async e=>{e.preventDefault();await sb.auth.signOut();load()};
  loadBo();
  loadWl();
  loadPs();
  loadFb();
}
// Best Offer prices: eBay sold listings where a Best Offer was accepted only show the asking price. Type what it
// actually sold for and Save: the sale gets that price and is approved (counts on the site within ~15 minutes).
async function loadBo(){let el=$('#bo');if(!el){app.insertAdjacentHTML('afterbegin','<div id="bo"></div>');el=$('#bo')}
  const r=await sb.rpc('admin_offer_sales');if(r.error){el.innerHTML=`<p class="msg err">${esc(r.error.message)}</p>`;return}
  const rows=r.data||[];if(!rows.length){el.innerHTML='';return}
  const usd=v=>'$'+(+v).toLocaleString('en-US',{maximumFractionDigits:2});
  el.innerHTML=`<h2>Best Offer prices <span class="tag">${rows.length} waiting</span></h2><p class="mt" style="margin-bottom:10px">eBay only shows the asking price on these. Open the listing, type what it actually sold for, and Save. Saving approves it.</p>
  <div class="tw box" style="padding:0"><table><thead><tr><th>Card</th><th>Version</th><th>Sold</th><th>Asking</th><th>Sold for</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr data-borow="${x.id}"><td>${esc(x.card_name||'')}<div class="tag">${esc(x.card_id)}</div></td><td>${esc([x.edition,x.printing,x.grader==='Raw'?'Raw':x.grader+' '+(x.grade||'')].filter(Boolean).join(' · '))}</td><td>${day(x.sold_at)}</td><td>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${usd(x.listed)} ↗</a>`:usd(x.listed)}</td><td><input data-boprice="${x.id}" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="e.g. ${Math.round(x.listed*0.85)}" style="width:120px"></td><td><button data-bosave="${x.id}">Save</button></td></tr>`).join('')}</tbody></table></div><p class="msg" id="bom"></p>`;
  const save=async id=>{const i=el.querySelector(`[data-boprice="${id}"]`),m=$('#bom'),v=+i.value;if(!(v>0)){m.className='msg err';m.textContent='Type the sold price first.';i.focus();return}
    const res=await sb.rpc('admin_set_offer_price',{p_id:+id,p_price:v});if(res.error){m.className='msg err';m.textContent=res.error.message;return}
    el.querySelector(`[data-borow="${id}"]`).remove();m.className='msg ok';m.textContent=`Saved at ${usd(v)} and approved.`;
    const next=el.querySelector('[data-boprice]');if(next)next.focus();else setTimeout(loadBo,1200)};
  el.querySelectorAll('[data-bosave]').forEach(b=>b.onclick=()=>save(b.dataset.bosave));
  el.querySelectorAll('[data-boprice]').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')save(i.dataset.boprice)});
}
// Premium waitlist: emails from the "Get early access" form on /premium/ (and card pages' alert buttons).
async function loadWl(){let el=$('#wl');if(!el){app.insertAdjacentHTML('beforeend','<div id="wl"></div>');el=$('#wl')}
  const [cards,r]=await Promise.all([cardsList().catch(()=>[]),sb.rpc('admin_waitlist')]);
  if(r.error){el.innerHTML=`<h2>Premium waitlist</h2><p class="msg err">${esc(r.error.message)}</p>`;return}
  const rows=r.data||[],names=Object.fromEntries(cards.map(c=>[c.id,c.label])),wk=rows.filter(x=>new Date(x.last_at)>Date.now()-7*864e5).length;
  el.innerHTML=`<h2>Premium waitlist</h2><p class="mt" style="margin-bottom:10px">People who asked for early access on the Premium page. <b style="color:var(--ink)">${rows.length}</b> ${rows.length===1?'person':'people'} · ${wk} in the last 7 days.${rows.length?' <button class="ghost" id="wlcopy">Copy all emails</button>':''}</p>
  <div class="tw box" style="padding:0"><table><thead><tr><th>Email</th><th>Signed up</th><th>Interested in</th><th>From</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.email)}${x.signups>1?`<div class="tag">${x.signups} signups</div>`:''}</td><td>${day(x.first_at)}${x.last_at!==x.first_at?`<div class="tag">latest ${day(x.last_at)}</div>`:''}</td><td>${x.cards.length?x.cards.map(id=>`<a href="/#card=${encodeURIComponent(id)}" target="_blank">${esc(names[id]||id)}</a>`).join('<br>'):'<span class="tag">Premium in general</span>'}</td><td class="tag">${esc(x.sources.map(s=>s==='card_page'?'card alert button':s==='premium_page'?'Premium page':s).join(', '))}</td></tr>`).join('')||'<tr><td colspan="4" class="tag">No signups yet.</td></tr>'}</tbody></table></div>`;
  const cb=$('#wlcopy');if(cb)cb.onclick=async()=>{await navigator.clipboard.writeText(rows.map(x=>x.email).join(', '));cb.textContent='Copied ✓'};
}
// Add a sale: sales David enters by hand from any source (ALT, Fanatics Collect, eBay, private...). They count everywhere
// a collected eBay sale does (price bands, Premium estimates, most-valuable pages) once the site syncs (every ~15 min).
// Each sale's {{sale ID}} code drops it into an article (pipeline/articles/*.md).
let CARDS=null;const SRCS=['Private','ALT','Fanatics Collect','eBay','Goldin','Heritage','PWCC','Card show','Other'];
async function cardsList(){if(CARDS)return CARDS;const d=await fetch('/cards.json').then(r=>r.json());const sets=Object.fromEntries(d.sets.map(s=>[s.id,s.name]));
  CARDS=d.cards.map(c=>({id:c.s+':'+c.n,label:`${c.name} · ${c.n} · ${sets[c.s]||c.s}`,v:c.v||[],ed:(c.ed||[]).filter(Boolean)}));return CARDS}
async function loadPs(){let el=$('#ps');if(!el){app.insertAdjacentHTML('beforeend','<div id="ps"></div>');el=$('#ps')}
  const [cards,r]=await Promise.all([cardsList().catch(()=>[]),sb.rpc('admin_hand_sales')]);
  const byId=Object.fromEntries(cards.map(c=>[c.id,c])),byLabel=Object.fromEntries(cards.map(c=>[c.label,c]));
  const today=new Date().toLocaleDateString('en-CA');
  el.innerHTML=`<h2>Add a sale</h2><p class="mt" style="margin-bottom:10px">Any confirmed sale: ALT, Fanatics, eBay, private. Counts like any approved sale and shows on the site within about 15 minutes. Copy a sale's code to put it in an article.</p>
  <form class="psale box" id="psf"><label class="wide"><span>Card (type a name or number)</span><input name="card" list="pscards" required autocomplete="off" placeholder="e.g. Sasuke Uchiha · PR088"></label>
  <label><span>Foil / printing</span><select name="pr"></select></label><label><span>Edition</span><select name="ed"></select></label>
  <label><span>Graded by</span><select name="gr">${['Raw','PSA','BGS','CGC','SGC','TAG','ACE'].map(g=>`<option>${g}</option>`).join('')}</select></label><label><span>Grade</span><input name="gd" placeholder="e.g. 10" disabled></label>
  <label><span>Sold on (where)</span><select name="src">${SRCS.map(x=>`<option>${x}</option>`).join('')}</select></label><label><span>Link to the sale (optional)</span><input name="url" type="url" placeholder="https://…"></label>
  <label><span>Price (USD)</span><input name="price" type="number" min="0.01" step="0.01" required></label><label><span>Date sold</span><input name="d" type="date" value="${today}" max="${today}" required></label>
  <label class="wide"><span>Note (private, optional)</span><input name="n" placeholder="e.g. bought from a collector at the show"></label><span></span><button>Add sale</button></form>
  <datalist id="pscards">${cards.map(c=>`<option value="${esc(c.label)}">`).join('')}</datalist><p class="msg" id="psm"></p>
  ${r.error?`<p class="msg err">${esc(r.error.message)}</p>`:`<div class="tw box" style="padding:0;margin-top:12px"><table><thead><tr><th>Sold</th><th>Card</th><th>Version</th><th>Price</th><th>Where</th><th>Note</th><th>Article code</th><th></th></tr></thead><tbody>${(r.data||[]).map(x=>`<tr><td>${day(x.sold_at)}</td><td>${esc(x.card_name||'')}<div class="tag">${esc(x.card_id)}</div></td><td>${esc([x.edition,x.printing,x.grader==='Raw'?'Raw':x.grader+' '+(x.grade||'')].filter(Boolean).join(' · '))}</td><td>$${(+x.price).toLocaleString('en-US',{maximumFractionDigits:2})}</td><td>${x.url&&/^https?:/.test(x.url)?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.source)} ↗</a>`:esc(x.source||'Private')}</td><td>${esc(x.note||'')}</td><td><button class="ghost" data-pscode="${x.id}">{{sale ${x.id}}}</button></td><td><button class="ghost" data-psdel="${x.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="8" class="tag">No hand-entered sales yet.</td></tr>'}</tbody></table></div>`}`;
  const f=$('#psf'),fill=()=>{const c=byLabel[f.card.value];f.pr.innerHTML=(c?c.v:[]).map(v=>`<option>${esc(v)}</option>`).join('')||'<option value="">—</option>';
    f.ed.innerHTML=(c&&c.ed.length?c.ed:['']).map(v=>`<option value="${esc(v)}">${esc(v||'—')}</option>`).join('')};
  f.card.oninput=fill;fill();f.gr.onchange=()=>{f.gd.disabled=f.gr.value==='Raw';if(f.gd.disabled)f.gd.value=''};
  f.onsubmit=async ev=>{ev.preventDefault();const m=$('#psm'),c=byLabel[f.card.value]||byId[f.card.value.trim()];
    if(!c){m.className='msg err';m.textContent='Pick a card from the list.';return}
    const res=await sb.rpc('admin_add_sale',{p_card_id:c.id,p_price:+f.price.value,p_sold_at:f.d.value,p_source:f.src.value,p_url:f.url.value.trim()||null,p_printing:f.pr.value,p_edition:f.ed.value,p_grader:f.gr.value,p_grade:f.gd.value.trim(),p_note:f.n.value.trim()||null});
    if(res.error){m.className='msg err';m.textContent=res.error.message;return}
    await loadPs();const m2=$('#psm');m2.className='msg ok';m2.textContent=`Added sale #${res.data}: ${c.label} at $${f.price.value}. Article code: {{sale ${res.data}}}. It shows on the site within about 15 minutes.`};
  el.querySelectorAll('[data-pscode]').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(`{{sale ${b.dataset.pscode}}}`);b.textContent='Copied ✓'});
  el.querySelectorAll('[data-psdel]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this sale?'))return;const res=await sb.rpc('admin_delete_private_sale',{p_id:+b.dataset.psdel});if(res.error)alert(res.error.message);loadPs()});
}
let FBSHOW='new';
async function loadFb(){const r=await sb.rpc('admin_feedback');let el=$('#fb');if(!el){app.insertAdjacentHTML('beforeend','<div id="fb"></div>');el=$('#fb')}
  if(r.error){el.innerHTML=`<h2>Feedback</h2><p class="msg err">${esc(r.error.message)}</p>`;return}
  const all=r.data||[],rows=all.filter(x=>FBSHOW==='all'?x.status!=='archived':x.status===FBSHOW),K={card:'🃏 Card info',idea:'💡 Idea',bug:'🐞 Bug',other:'💬 Other'};
  const cnt=s=>all.filter(x=>x.status===s).length;
  el.innerHTML=`<h2>Feedback</h2><p class="mt" style="margin-bottom:10px">${['new','done','all'].map(s=>`<button class="ghost" data-fbs="${s}" style="${FBSHOW===s?'color:var(--ink);border-color:var(--acc)':''}">${s==='new'?'New ('+cnt('new')+')':s==='done'?'Done ('+cnt('done')+')':'All'}</button>`).join(' ')}</p>
  <div class="tw box" style="padding:0"><table><thead><tr><th>When</th><th>Type</th><th>Note</th><th>From</th><th></th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td>${day(x.created_at)}</td><td>${K[x.kind]||esc(x.kind)}${x.card_id?`<div class="tag"><a href="/#card=${encodeURIComponent(x.card_id)}" target="_blank">${esc(x.card_id)}</a></div>`:''}</td><td style="max-width:460px"><div style="white-space:pre-wrap">${esc(x.message)}</div>${x.target||x.page?`<div class="tag" style="margin-top:4px">${x.page?`<a href="${esc(x.page.split('#')[0]+(x.selector?(x.page.includes('?')?'&':'?')+'fbspot='+encodeURIComponent(x.selector):''))}" target="_blank">${esc(x.page.split('?')[0]||'/')}</a>`:''}${x.target?' · 📍 '+esc(x.target):''}</div>`:''}</td><td>${esc(x.name||'')}${x.contact?`<div class="tag">${esc(x.contact)}</div>`:''}${!x.name&&!x.contact?'<span class="tag">anonymous</span>':''}</td><td style="white-space:nowrap">${x.status==='new'?`<button class="ghost" data-fbset="${x.id}" data-to="done">✓ Done</button>`:`<button class="ghost" data-fbset="${x.id}" data-to="new">↺ New</button>`} <button class="ghost" data-fbset="${x.id}" data-to="archived">Archive</button></td></tr>`).join(''):'<tr><td colspan="5" class="tag">Nothing here.</td></tr>'}</tbody></table></div>`;
  el.querySelectorAll('[data-fbs]').forEach(b=>b.onclick=()=>{FBSHOW=b.dataset.fbs;loadFb()});
  el.querySelectorAll('[data-fbset]').forEach(b=>b.onclick=async()=>{const r=await sb.rpc('admin_feedback_status',{p_id:+b.dataset.fbset,p_status:b.dataset.to});if(r.error)alert(r.error.message);loadFb()});
}
load();
}
</script>
</body>
</html>
